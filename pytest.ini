[pytest]
DJANGO_SETTINGS_MODULE = facturation_backend.settings_test
# -- recommended but optional:
python_files = tests.py test_*.py *_tests.py
filterwarnings = ignore:'asyncio.*':DeprecationWarning
# The versioned assistant snapshot includes standalone Colibri CLI tests.
# Application authorization tests live in chat_ai; do not collect vendor CLIs.
# Coverage options
addopts = --ignore=assistant --cov=facturation_backend --cov-branch --cov-report=term --cov-report=xml:coverage.xml --cov-config=.coveragerc
